<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leaflet JS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/Leaflet.awesome-markers/2.0.2/leaflet.awesome-markers.css" />
    <style>
        html,
        body,
        #map {
            width: 100%;
            height: calc(100vh - 56px);
            margin: 0;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Navbar</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="https://www.instagram.com/putra_ekaprabowo?stkn=MWJtajV4bm5taTVzZw=="
                            target="_blank" rel="noopener noreferrer"><i class="bi bi-instagram"></i> Contact Me</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" data-bs-toggle="modal" data-bs-target="#aboutModal"><i
                                class="bi bi-info-circle"></i> About</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div id="map"></div>

    <!-- Modal -->
    <div class="modal fade" id="aboutModal" tabindex="-1" aria-labelledby="aboutModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="aboutModalLabel">About</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <table class="table table-bordered table-striped">
                        <tbody>
                            <tr>
                                <th width="30%">Nama</th>
                                <td>Putra Immanuel Eka Prabowo</td>
                            </tr>
                            <tr>
                                <th>NIM</th>
                                <td>25/568122/SV/27368</td>
                            </tr>
                            <tr>
                                <th>Kelas</th>
                                <td>PGWEB B</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Feature Modal -->
    <div class="modal fade" id="featureModal" tabindex="-1" aria-labelledby="featureModalTitle" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h1 class="modal-title fs-5" id="featureModalTitle"></h1>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Close"></button>
                </div>
                <div class="modal-body" id="featureModalBody">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Tutup</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/Leaflet.awesome-markers/2.0.2/leaflet.awesome-markers.js"></script>

    <script>
        // Inisialisasi peta
        var map = L.map("map").setView([-8.3249682, 123.0053329], 11);

        // Tile Layer Base Map
        var basemap = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            attribution:
                '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        });

        // Menambahkan basemap ke dalam peta
        basemap.addTo(map);

        // Membuat Custom Panes
        map.createPane('pane_jumlah_penduduk');
        map.getPane('pane_jumlah_penduduk').style.zIndex = 300;

        map.createPane('pane_jalan');
        map.getPane('pane_jalan').style.zIndex = 400;

        // GeoJSON Point Toponimi
        var toponimi = L.geoJSON(null, {
            // Style
            pointToLayer: function (feature, latlng) {
                var markerIcon, markerColor;

                if (feature.properties.NAMA_UNSUR === "Gunung") {
                    markerIcon = "mountain";
                    markerColor = "red";
                } else if (feature.properties.NAMA_UNSUR === "Tanjung") {
                    markerIcon = "map-marker-alt";
                    markerColor = "blue";
                } else if (feature.properties.NAMA_UNSUR === "Teluk") {
                    markerIcon = "water";
                    markerColor = "cadetblue";
                } else {
                    markerIcon = "info-circle";
                    markerColor = "green";
                }

                var awesomeMarker = L.AwesomeMarkers.icon({
                    icon: markerIcon,
                    markerColor: markerColor,
                    prefix: 'fa'
                });

                return L.marker(latlng, { icon: awesomeMarker });
            },
            // onEachFeature
            onEachFeature: function (feature, layer) {
                // variable popup content
                var popup_content = "<img src='images/" + feature.properties.image + "' alt='' width='200'/><br>" +
                    "Nama: " + feature.properties.TOPONIMI + "<br>" +
                    "Koordinat: " + feature.geometry.coordinates[1] + ", " + feature.geometry.coordinates[0];

                layer.on({
                    click: function (e) {
                        toponimi.bindPopup(popup_content);

                    },
                    mouseover: function (e) {
                        toponimi.bindTooltip(feature.properties.TOPONIMI, {
                            direction: "left",
                            sticky: true,
                        });
                    },

                });

            },
        });

        $.getJSON("GeoJSON/toponimi.geojson", function (data) {
            toponimi.addData(data); // Menambahkan data ke dalam GeoJSON Point Toponimi
            map.addLayer(toponimi); // Menambahkan GeoJSON Point Toponimi ke dalam peta
        });

        // GeoJSON Polyline Jalan
        var jalan = L.geoJSON(null, {
            pane: 'pane_jalan',
            // Style
            style: function (feature) {
                if (feature.properties.NAMA_UNSUR === "Jalan Propinsi" || feature.properties.NAMA_UNSUR === "Jalan Provinsi") {
                    return {
                        color: "red",
                        weight: 4,
                        opacity: 1
                    };
                } else if (feature.properties.NAMA_UNSUR === "Jalan Kabupaten") {
                    return {
                        color: "red",
                        weight: 2,
                        opacity: 1,
                        dashArray: "5, 5"
                    };
                } else {
                    return {
                        color: "black",
                        weight: 1,
                        opacity: 1,
                        dashArray: "5, 5"
                    };
                }
            },
            // onEachFeature
            onEachFeature: function (feature, layer) {
                // variable popup content
                var popup_content = "Fungsi: " + feature.properties.NAMA_UNSUR + "<br>" +
                    "Panjang (km): " + feature.properties.panjang_km;

                layer.on({
                    click: function (e) {
                        jalan.bindPopup(popup_content);
                    },
                    mouseover: function (e) {
                        jalan.bindTooltip(feature.properties.NAMA_UNSUR, {
                            direction: "auto",
                            sticky: true,
                        });
                    },
                });
            },
        });

        $.getJSON("GeoJSON/jalan.geojson", function (data) {
            jalan.addData(data); // Menambahkan data ke dalam GeoJSON Polyline Jalan
            map.addLayer(jalan); // Menambahkan GeoJSON Polyline Jalan ke dalam peta
        });

        // GeoJSON Polygon Jumlah Penduduk
        var jumlah_penduduk = L.geoJSON(null, {
            pane: 'pane_jumlah_penduduk',
            // Style
            // Style
            style: function (feature) {
                if (feature.properties.Penduduk <= 12000) {
                    return {
                        opacity: 1,
                        color: 'grey',
                        weight: 1.0,
                        fillOpacity: 0.7,
                        fillColor: '#ffffb2'
                    };
                }
                if (feature.properties.Penduduk > 12000 && feature.properties.Penduduk <= 24000) {
                    return {
                        opacity: 1,
                        color: 'grey',
                        weight: 1.0,
                        fillOpacity: 0.7,
                        fillColor: '#fd8d3c'
                    };
                }
                if (feature.properties.Penduduk > 24000) {
                    return {
                        opacity: 1,
                        color: 'grey',
                        weight: 1.0,
                        fillOpacity: 0.7,
                        fillColor: '#bd0026'
                    };
                }
            },
            // onEachFeature
            onEachFeature: function (feature, layer) {
                layer.on({
                    click: function (e) {
                        // Mengisi judul modal
                        $("#featureModalTitle").html("Informasi Kecamatan " + feature.properties.NAMOBJ);

                        // Mengisi body modal dengan tabel
                        var content = "<table class='table table-striped table-bordered mb-0'>";
                        content += "<tr><th>Kecamatan</th><td>" + feature.properties.NAMOBJ + "</td></tr>";
                        content += "<tr><th>Luas Wilayah</th><td>" + feature.properties.luas_km2 + " km²</td></tr>";
                        content += "<tr><th>Jumlah Penduduk</th><td>" + feature.properties.Penduduk + " Jiwa</td></tr>";
                        content += "</table>";

                        $("#featureModalBody").html(content);

                        // Menampilkan modal Bootstrap
                        var featureModal = bootstrap.Modal.getOrCreateInstance(document.getElementById('featureModal'));
                        featureModal.show();
                    },
                    mouseover: function (e) {
                        layer.bindTooltip(feature.properties.NAMOBJ, {
                            direction: "auto",
                            sticky: true,
                        });
                    },
                });
            }
        });

        $.getJSON("GeoJSON/jumlah_penduduk.geojson", function (data) {
            jumlah_penduduk.addData(data); // Menambahkan data ke dalam GeoJSON Polygon Jumlah Penduduk
            map.addLayer(jumlah_penduduk); // Menambahkan GeoJSON Polygon Jumlah Penduduk ke dalam peta
        });

        // Control Layer
        var baseMaps = {
            "OpenStreetMap": basemap
        };

        var overlayMaps = {
            "Toponimi": toponimi,
            "Jalan": jalan,
            "Jumlah Penduduk": jumlah_penduduk,
        };

        var controllayer = L.control.layers(baseMaps, overlayMaps);
        controllayer.addTo(map);


        // Menambahkan Legenda
        var legend = L.control({ position: 'bottomleft' });

        legend.onAdd = function (map) {
            var div = L.DomUtil.create('div', 'info legend');

            // CSS untuk legenda
            div.style.backgroundColor = 'white';
            div.style.padding = '10px';
            div.style.borderRadius = '5px';
            div.style.boxShadow = '0 0 15px rgba(0,0,0,0.2)';
            div.style.lineHeight = '18px';
            div.style.color = '#555';

            var legendContent = '<h5 style="margin-bottom:10px; color:black; text-align:center;">Legenda</h5>';

            // Toponimi
            legendContent += '<b style="color:black;">Toponimi</b><br>';
            legendContent += '<i class="fas fa-mountain" style="color:red; margin-right:5px;"></i> Gunung<br>';
            legendContent += '<i class="fas fa-map-marker-alt" style="color:blue; margin-right:5px;"></i> Tanjung<br>';
            legendContent += '<i class="fas fa-water" style="color:cadetblue; margin-right:5px;"></i> Teluk<br>';
            legendContent += '<i class="fas fa-info-circle" style="color:green; margin-right:5px;"></i> Lainnya<br>';

            // Jalan
            legendContent += '<b style="margin-top:10px; display:block; color:black;">Jalan</b>';
            legendContent += '<div style="display:inline-block; width:30px; height:4px; background-color:red; margin-bottom:3px; margin-right:5px; vertical-align:middle;"></div> Jalan Provinsi<br>';
            legendContent += '<div style="display:inline-block; width:30px; height:0px; border-top:2px dashed red; margin-bottom:3px; margin-right:5px; vertical-align:middle;"></div> Jalan Kabupaten<br>';
            legendContent += '<div style="display:inline-block; width:30px; height:0px; border-top:1px dashed black; margin-bottom:3px; margin-right:5px; vertical-align:middle;"></div> Jalan Lain<br>';

            // Jumlah Penduduk
            legendContent += '<b style="margin-top:10px; display:block; color:black;">Jumlah Penduduk</b>';
            var populationColors = ['#ffffb2', '#fd8d3c', '#bd0026'];
            var populationLabels = ['<= 12.000', '12.000 - 24.000', '> 24.000'];

            for (var i = 0; i < populationColors.length; i++) {
                legendContent +=
                    '<i style="background:' + populationColors[i] + '; width:18px; height:18px; float:left; margin-right:8px; opacity:0.7; border:1px solid black;"></i> ' +
                    populationLabels[i] + '<br>';
            }

            div.innerHTML = legendContent;
            return div;
        };

        legend.addTo(map);

        // Menambahkan Scale Bar
        L.control.scale({
            position: 'bottomright',
            metric: true,
            imperial: false
        }).addTo(map);

    </script>
</body>

</html>
